[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paris_2025"
version = "0.1.0"
description = "A project for CO2 modelling in paris."
authors = [
    { name="Robert Maiwald", email="robert.maiwald@uni-heidelberg.de" },
]
requires-python = ">=3.7"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
